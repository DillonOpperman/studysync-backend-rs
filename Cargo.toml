[package]
name = "studysync-backend"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "StudySync production API (Rust). This repository is not the legacy Flask backend."

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
bcrypt = "0.16"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hf-hub = "0.5"
hmac = "0.12"
jsonwebtoken = "9"
pgvector = { version = "0.4", features = ["sqlx"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusty-s3 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokenizers = "0.23.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "std", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokenizers = "0.23.2"
http-body-util = "0.1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
